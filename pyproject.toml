[project]
name = "k8s-sre-agent"
version = "1.0.0"
description = "Kubernetes SRE investigation agent - AgentOps reference build (LangGraph + Amazon Bedrock)"
requires-python = ">=3.12"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 130
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S"]
ignore = ["S101", "S603", "B008", "E731"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S", "B"]
"app/agent.py" = ["E501"]   # prompt text
"app/smoke.py" = ["S310"]   # localhost-only HTTP call
