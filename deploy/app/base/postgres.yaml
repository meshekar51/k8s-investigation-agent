# Memory database for the agent (transcript step 6: "they need a database").
# One PostgreSQL per environment namespace, data on a PVC (kind's local-path storage).
# LangGraph creates its own tables on first start (checkpoints*, store*).
apiVersion: v1
kind: Service
metadata:
  name: sre-agent-db
  labels: {app.kubernetes.io/name: sre-agent-db}
spec:
  clusterIP: None
  selector: {app.kubernetes.io/name: sre-agent-db}
  ports:
    - {name: pg, port: 5432, targetPort: pg}
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: sre-agent-db
  labels: {app.kubernetes.io/name: sre-agent-db}
spec:
  serviceName: sre-agent-db
  replicas: 1
  selector:
    matchLabels: {app.kubernetes.io/name: sre-agent-db}
  template:
    metadata:
      labels: {app.kubernetes.io/name: sre-agent-db}
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 70              # "postgres" user in the alpine image
        runAsGroup: 70
        fsGroup: 70
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: postgres
          image: postgres:17-alpine
          ports:
            - {name: pg, containerPort: 5432}
          env:
            - name: POSTGRES_USER
              valueFrom: {configMapKeyRef: {name: sre-agent-config, key: POSTGRES_USER}}
            - name: POSTGRES_DB
              valueFrom: {configMapKeyRef: {name: sre-agent-config, key: POSTGRES_DB}}
            - name: POSTGRES_PASSWORD
              valueFrom: {secretKeyRef: {name: sre-agent-db, key: POSTGRES_PASSWORD}}
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          readinessProbe:
            exec: {command: ["sh", "-c", "pg_isready -h 127.0.0.1 -U \"$POSTGRES_USER\" -d \"$POSTGRES_DB\""]}
            periodSeconds: 5
          livenessProbe:
            exec: {command: ["sh", "-c", "pg_isready -h 127.0.0.1 -U \"$POSTGRES_USER\" -d \"$POSTGRES_DB\""]}
            initialDelaySeconds: 30
            periodSeconds: 20
          resources:
            requests: {cpu: 50m, memory: 128Mi}
            limits: {memory: 512Mi}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: {drop: [ALL]}
          volumeMounts:
            - {name: data, mountPath: /var/lib/postgresql/data}
            - {name: run, mountPath: /var/run/postgresql}
      volumes:
        - name: run
          emptyDir: {}
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: [ReadWriteOnce]
        resources:
          requests: {storage: 1Gi}
