# Identity for the agent INSIDE the cluster (transcript step 7).
# Analogy: the agent gets a visitor badge that opens every door to LOOK, none to TOUCH,
# and never the safe (Secrets). Every API call it makes shows up in the audit log as
#   system:serviceaccount:agent-prod:sre-agent
# Applied by scripts/deploy.sh (in a shared cluster, a cluster admin would own this layer).
apiVersion: v1
kind: ServiceAccount
metadata:
  name: sre-agent
  namespace: agent-staging
  labels: {app.kubernetes.io/name: sre-agent}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: sre-agent
  namespace: agent-prod
  labels: {app.kubernetes.io/name: sre-agent}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: sre-agent-readonly
  labels: {app.kubernetes.io/name: sre-agent}
rules:
  - apiGroups: [""]
    resources: [pods, pods/log, events, nodes, services, endpoints, configmaps,
                persistentvolumeclaims, persistentvolumes, namespaces]
    verbs: [get, list, watch]
  - apiGroups: [apps]
    resources: [deployments, replicasets, statefulsets, daemonsets]
    verbs: [get, list, watch]
  - apiGroups: [batch]
    resources: [jobs, cronjobs]
    verbs: [get, list, watch]
  - apiGroups: [networking.k8s.io]
    resources: [ingresses, networkpolicies]
    verbs: [get, list, watch]
  - apiGroups: [discovery.k8s.io]
    resources: [endpointslices]
    verbs: [get, list, watch]
  - apiGroups: [events.k8s.io]
    resources: [events]
    verbs: [get, list, watch]
  - apiGroups: [storage.k8s.io]
    resources: [storageclasses]
    verbs: [get, list, watch]
  - apiGroups: [autoscaling]
    resources: [horizontalpodautoscalers]
    verbs: [get, list, watch]
  # Deliberately absent: secrets, pods/exec, pods/portforward, any create/update/patch/delete.
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: sre-agent-readonly
  labels: {app.kubernetes.io/name: sre-agent}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: sre-agent-readonly
subjects:
  - kind: ServiceAccount
    name: sre-agent
    namespace: agent-staging
  - kind: ServiceAccount
    name: sre-agent
    namespace: agent-prod
