apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: sre-agent
  labels:
    release: kps            # kube-prometheus-stack only picks up monitors with its release label
spec:
  namespaceSelector:
    matchNames: [agent-staging, agent-prod]
  selector:
    matchLabels: {app.kubernetes.io/name: sre-agent}
  endpoints:
    - port: http
      path: /metrics/
      interval: 30s
